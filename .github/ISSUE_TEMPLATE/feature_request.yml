name: Feature request
description: Suggest an improvement or support for new hardware
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. English or Dutch is fine (Nederlands mag ook).

        Asking for support of a new lamp type (for example RGB)? Testers with that hardware make it possible — say so below.

  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      placeholder: Support for Häfele Connect Mesh RGB strips.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would this help you?
      placeholder: I would like to set colours from Homey Flows.

  - type: textarea
    id: hardware
    attributes:
      label: Hardware involved (if any)
      placeholder: Loox5 RGB strip with Connect Mesh controller

  - type: checkboxes
    id: tester
    attributes:
      label: Testing
      options:
        - label: I have this hardware and can test a beta version.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did **not** include my `.connect` file or any network, application or device key.
          required: true
