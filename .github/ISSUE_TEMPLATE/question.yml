name: Question
description: Ask how something works or how to set it up
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        English or Dutch is fine (Nederlands mag ook).

        Tip: the app settings have a **Diagnostics** page with the connection, signal strength and a network scan — a screenshot of it often answers the question quickly. Never share your `.connect` file.

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "0.0.1"

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did **not** include my `.connect` file or any network, application or device key.
          required: true
