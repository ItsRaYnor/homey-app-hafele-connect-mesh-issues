name: Bug report
description: Something does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. English or Dutch is fine (Nederlands mag ook).

        > [!CAUTION]
        > **Never paste your `.connect` file, or any part of it, in an issue.** It contains the keys of your lighting network: anyone with it can control your lights. A screenshot of the **Diagnostics** page in the app settings is safe — it shows addresses only, never keys.

        This is an **unofficial** app. Please do not contact Häfele about it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem, including any error message you saw.
      placeholder: When I switch "LED Spot tv" on, Homey shows "The light did not respond".
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the light in Homey
        2. Turn it on
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Homey app › Settings › Apps › Häfele Connect Mesh.
      placeholder: "0.0.1"
    validations:
      required: true

  - type: dropdown
    id: homey-model
    attributes:
      label: Homey model
      options:
        - Homey Pro (2023)
        - Homey Pro (Early 2019)
        - Homey Pro mini
        - Other
    validations:
      required: true

  - type: input
    id: homey-version
    attributes:
      label: Homey version
      description: Homey app › Settings › General.
      placeholder: "12.6.0"

  - type: textarea
    id: hardware
    attributes:
      label: Häfele hardware
      description: Which lamps and controllers are involved?
      placeholder: Connect Mesh 6-way distributor 850.00.043 with 3 Loox5 LED spots (monochrome)
    validations:
      required: true

  - type: dropdown
    id: keep-alive
    attributes:
      label: Keep-alive setting ("Release the lamp after")
      options:
        - 0 (always connected)
        - Other value
        - Don't know

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        App settings › **Diagnostics**: attach a screenshot of the connection card (signal strength, last error) and, if possible, the result of **Scan network**.
        These contain no key material.

  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: If you have a log, paste the relevant lines. Logs from this app never contain network keys.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did **not** include my `.connect` file or any network, application or device key.
          required: true
